name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmaassist
          POSTGRES_USER: pharmaassist
          POSTGRES_PASSWORD: pharmaassist_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmaassist -d pharmaassist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pharmaassist:pharmaassist_dev_password@localhost:5432/pharmaassist
      APP_ENV: development
      JWT_SECRET_KEY: ci-test-jwt-secret-key-at-least-32-chars
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OCR_ALLOW_MOCK_FALLBACK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Pytest
        run: python -m pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck / build
        run: npm run build
